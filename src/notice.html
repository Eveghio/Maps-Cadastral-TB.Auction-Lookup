<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>ვერ მოიძებნა</title>
  <style>
    body { margin: 0; padding: 16px 18px; font-family: sans-serif; font-size: 14px; color: #222; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    .sum { color: #555; margin-bottom: 12px; }
    ul { margin: 0 0 12px; padding-left: 20px; max-height: 340px; overflow: auto; }
    li { margin: 3px 0; font-family: monospace; font-size: 14px; }
    li .err { font-family: sans-serif; font-size: 12px; color: #b91c1c; }
    h2 { font-size: 13px; margin: 10px 0 4px; color: #444; }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; }
    button { padding: 7px 14px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #1d6fb8; }
    #close { background: #1d6fb8; color: #fff; }
    #history { background: #fff; color: #1d6fb8; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="sum" id="sum"></div>
  <div id="lists"></div>
  <div class="buttons">
    <button id="history">ისტორია</button>
    <button id="close" autofocus>დახურვა (Enter / Esc)</button>
  </div>
  <script src="shared-ui.js"></script>
  <script src="notice.js"></script>
</body>
</html>
